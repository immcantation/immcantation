name: Update Citations

on:
  # Run on manual trigger
  workflow_dispatch:
  
  # Run on schedule (monthly on the 1st at 00:00 UTC)
  schedule:
    - cron: '0 0 1 * *'

jobs:
  update-citations:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas
      
      - name: Query PubMed for citations
        env:
          PUBMED_EMAIL: ${{ secrets.PUBMED_EMAIL }}
        run: |
          cd docs/_citations
          python query_citations.py \
            --input-file immcantation-publications.tsv \
            --output-file immcantation_citations.tsv \
            --email "$PUBMED_EMAIL"
      
      - name: Format citations to RST
        run: |
          cd docs/_citations
          python format_citations.py \
            -i immcantation_citations.tsv \
            -o ../citedby.rst

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-citations
          base: master
          commit-message: "chore: update citations from PubMed"
          title: "chore: update citations from PubMed"
          body: |
            Automated monthly update of citation data from PubMed.

            Changes:
            - `docs/citedby.rst` — regenerated from latest PubMed query
            - `docs/_citations/immcantation_citations.tsv` — raw citation data
          add-paths: |
            docs/citedby.rst
            docs/_citations/immcantation_citations.tsv
          labels: documentation
          delete-branch: true
